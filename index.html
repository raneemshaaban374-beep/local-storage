<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>My Personal Notes</h2>
    <input id="save" type="text" placeholder="Enter note title">
    <label>
        <div></div>
        <textarea id="store" rows="2" cols="25" placeholder="Write your note"></textarea>
    </label>
    <button id="savebtn">Save note</button>
    <button id="displaybtn">Display note </button>
    <button id="clearbtn">Clear note</button>
    <h3 id="savedtitle"></h3>
    <p id="savedcontent"></p>
    <script src="script.js"></script>
</body>
</html>
